name: Gerar APK

permissions:
  contents: write

on:
  push:
    branches: [painel]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Biblioteca do Supabase local
        run: cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Ícone, atualização por dentro e permissões
        run: |
          cp -r native/res/. android/app/src/main/res/
          D=android/app/src/main/java/com/telaoplay/painel
          cp native/MainActivity.java native/AppUpdatePlugin.java "$D/"
          M=android/app/src/main/AndroidManifest.xml
          for P in REQUEST_INSTALL_PACKAGES POST_NOTIFICATIONS; do
            grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M
          done

      - name: Versão e assinatura fixa (permite atualizar por cima)
        run: |
          VC=$((100 + GITHUB_RUN_NUMBER))
          VN="1.$GITHUB_RUN_NUMBER"
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"$VN\"/" $G
          sed -i "0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile rootProject.file('..\/native\/painel.keystore')\n            storePassword 'painel2026'\n            keyAlias 'painel'\n            keyPassword 'painel2026'\n        }\n    }/" $G
          echo "VC=$VC" >> $GITHUB_ENV
          echo "VN=$VN" >> $GITHUB_ENV

      - name: Compilar APK
        working-directory: android
        run: |
          ok=0
          for i in 1 2 3 4; do
            ./gradlew assembleDebug && ok=1 && break
            echo "Falha ao baixar pacotes; tentando de novo ($i)"; sleep 40
          done
          test $ok = 1

      - name: Publicar APK e aviso de atualização
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk painel-licencas.apk
          U="https://github.com/$GITHUB_REPOSITORY/releases/download/painel-latest/painel-licencas.apk"
          printf '{"versionCode":%s,"versionName":"%s","url":"%s","notes":"Atualização do painel"}' "$VC" "$VN" "$U" > update.json
          cat update.json
          gh release delete painel-latest --cleanup-tag -y || true
          gh release create painel-latest painel-licencas.apk update.json --target "$GITHUB_SHA" --title "Painel Licenças $VN" --notes "APK do painel de licenças (versão $VN)" --latest=false
