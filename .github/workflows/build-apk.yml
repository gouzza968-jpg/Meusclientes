name: Gerar APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Baixar leitor de planilhas (xlsx)
        run: curl -fsSL -o www/xlsx.full.min.js https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Ícone do aplicativo
        run: cp -r native/res/. android/app/src/main/res/

      - name: Permissões de notificação
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS RECEIVE_BOOT_COMPLETED SCHEDULE_EXACT_ALARM REQUEST_INSTALL_PACKAGES; do
            grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M
          done
          grep -n "uses-permission" $M

      - name: Plugin nativo do WhatsApp Business
        run: |
          D=android/app/src/main/java/com/meusclientes/app
          cp native/WaBusinessPlugin.java native/AppUpdatePlugin.java native/MainActivity.java "$D/"

      - name: Versão e assinatura fixa (permite atualizar o app por cima)
        run: |
          VC=$((100 + GITHUB_RUN_NUMBER))
          VN="1.$GITHUB_RUN_NUMBER"
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"$VN\"/" $G
          sed -i "0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile rootProject.file('..\/native\/meusclientes.keystore')\n            storePassword 'meusclientes'\n            keyAlias 'meusclientes'\n            keyPassword 'meusclientes'\n        }\n    }/" $G
          sed -i "s/__APP_VERSION__/$VN/" www/index.html android/app/src/main/assets/public/index.html
          echo "VC=$VC" >> $GITHUB_ENV
          echo "VN=$VN" >> $GITHUB_ENV
          grep -n "versionCode\|versionName\|storeFile" $G

      - name: Sons de notificação
        run: |
          mkdir -p android/app/src/main/res/raw
          for f in www/sons/*.wav; do cp "$f" "android/app/src/main/res/raw/nt_$(basename $f)"; done
          ls android/app/src/main/res/raw

      - name: Proteger o app (ofuscar código e travar assinatura)
        run: |
          H=android/app/src/main/assets/public/index.html
          node native/protect.js $H
          node --check /tmp/_check.js
          CERT=$(keytool -list -v -keystore native/meusclientes.keystore -storepass meusclientes -alias meusclientes 2>/dev/null | grep "SHA256:" | sed 's/.*SHA256: //;s/://g' | tr A-Z a-z)
          HASH=$(sha256sum $H | cut -d' ' -f1)
          echo "cert=$CERT html=$HASH"
          test -n "$CERT" && test -n "$HASH"
          J=android/app/src/main/java/com/meusclientes/app/MainActivity.java
          sed -i "s/__CERT_SHA256__/$CERT/; s/__HTML_SHA256__/$HASH/" $J
          grep -n "SHA256 =" $J

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: meus-clientes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar atualização para o app (Release)
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk meus-clientes.apk
          NOTES="Atualização de segurança"
          printf '{"versionCode":%s,"versionName":"%s","url":"https://github.com/%s/releases/download/v%s/meus-clientes.apk","notes":"%s"}' "$VC" "$VN" "$GITHUB_REPOSITORY" "$VN" "$NOTES" > update.json
          cat update.json
          gh release create "v$VN" meus-clientes.apk update.json --title "Versão $VN" --notes "$NOTES" --latest
